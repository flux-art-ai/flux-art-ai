name: Sync to Gitee

on:
  schedule:
    - cron: '17 * * * *'   # 每小时一次
  workflow_dispatch: {}     # 支持手动触发(Actions 页 Run workflow 按钮)
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitHub -> Gitee (branches + tags)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          umask 077
          printf 'machine gitee.com\nlogin flux-art\npassword %s\n' "$GITEE_TOKEN" > ~/.netrc
          fail=0
          for r in flux-art flux-art-ecom-image-workflow awesome-ecom-ai-images flux-art-ai; do
            echo "== $r =="
            git clone --quiet --mirror "https://github.com/flux-art-ai/$r.git" "$r.git"
            if git -C "$r.git" push --force --quiet "https://gitee.com/flux-art/$r.git" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'; then
              echo "OK: $r"
            else
              echo "FAILED: $r"; fail=$((fail+1))
            fi
          done
          rm -f ~/.netrc
          echo "failed=$fail"
          exit "$fail"
